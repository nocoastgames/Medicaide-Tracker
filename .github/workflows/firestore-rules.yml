name: Deploy Firestore rules

on:
  push:
    branches: ["main"]
    paths:
      - "firestore.rules"
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules
        run: npx firebase-tools@13 deploy --only firestore:rules --project gen-lang-client-0009329709 --non-interactive
